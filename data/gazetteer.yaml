# Static location gazetteer for geo normalization (no API needed).
# Matching is substring-based on lowercased, punctuation-stripped location text.

seattle_metro:
  - seattle
  - bellevue
  - redmond
  - kirkland
  - bothell
  - everett
  - renton
  - kent
  - tukwila
  - issaquah
  - sammamish
  - lynnwood
  - mukilteo
  - auburn
  - federal way
  - tacoma
  - woodinville
  - mercer island
  - shoreline
  - duvall
  - monroe
  - snoqualmie
  - north bend
  - puget sound
  - greater seattle

# Washington-state (but outside the immediate metro) still ranks above "other".
washington:
  - wa
  - washington state
  - washington, us
  - spokane
  - vancouver, wa
  - olympia
  - bellingham
  - richland
  - pullman

# Non-US markers. If a posting's location matches one of these AND carries no US
# signal (state/USA/remote-US), it's flagged international and can be dropped by
# profile.exclude_international (config.yaml). Amazon uses ISO-3 prefixes like
# "ESP - Madrid, Spain", so those are included too.
international_markers:
  # country names
  - spain
  - serbia
  - india
  - germany
  - france
  - italy
  - ireland
  - united kingdom
  - england
  - scotland
  - canada
  - mexico
  - brazil
  - japan
  - china
  - singapore
  - australia
  - netherlands
  - poland
  - romania
  - portugal
  - israel
  - switzerland
  - sweden
  - denmark
  - norway
  - finland
  - austria
  - belgium
  - luxembourg
  - south korea
  - taiwan
  - philippines
  - vietnam
  - indonesia
  - malaysia
  - united arab emirates
  - saudi arabia
  - egypt
  - south africa
  - argentina
  - colombia
  - chile
  - costa rica
  # major foreign tech-hub cities that often appear without a country
  - madrid
  - barcelona
  - belgrade
  - bengaluru
  - bangalore
  - hyderabad
  - chennai
  - pune
  - gurgaon
  - london
