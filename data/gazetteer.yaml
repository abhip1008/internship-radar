  # Amazon-style ISO-3 country prefixes ("ESP - Madrid")
  - "esp -"
  - "ind -"
  - "deu -"
  - "gbr -"
  - "can -"
  - "irl -"
  - "fra -"
  - "ita -"
  - "pol -"
  - "rou -"
  - "jpn -"
  - "chn -"
  - "aus -"
  - "bra -"
