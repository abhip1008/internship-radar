remote_us:
  - remote (us)
  - remote - us
  - remote, us
  - remote usa
  - us remote
  - united states (remote)
  - remote united states

# Canonical display names for the most common metro cities.
canonical:
  seattle: "Seattle, WA"
  bellevue: "Bellevue, WA"
  redmond: "Redmond, WA"
  kirkland: "Kirkland, WA"
  bothell: "Bothell, WA"
