# Tier 0 — Seattle-area company registry (15-min polling target).
# Every entry is a *candidate*. `radar detect` confirms the real ATS and board
# token; do not trust the `ats`/`board_token` guesses here until probed.
#
# Fields:
#   name         display name
#   slug         internal id (also the default board-token guess)
#   ats          greenhouse|lever|ashby|smartrecruiters|workable|recruitee|workday|custom|manual
#   board_token  token for the ATS board (greenhouse/lever/ashby/...)
#   collector    for ats: custom, the dotted module (custom.amazon)
#   workday      {tenant, wd, site} for workday employers
#   hq / offices location info
#   tier         polling tier (0 = highest)
#   watchlist    instant-alert on any posting from this company
#   tags         freeform

# ---- Large tech (custom / big-co collectors) ----
